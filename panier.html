<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panier — [NOM DE LA MARQUE]</title>
  <meta name="description" content="[PLACEHOLDER] Le panier — articles ajoutés, quantités et total." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet" />
  </noscript>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="scrollytelling static-shader-page">

  <div id="shader-bg" class="site-shader-bg" data-shader-variant="static" aria-hidden="true"></div>

  <div class="floating-nav">
    <a href="index.html#accueil" class="floating-logo" data-cms="general.brand_name">[NOM MARQUE]</a>
    <div class="nav-actions">
      <a href="panier.html" class="cart-btn" data-cart-btn aria-label="Panier">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 8h12l-1 12H7L6 8Z" />
          <path d="M9 8V6a3 3 0 0 1 6 0v2" />
        </svg>
        <span class="cart-badge" data-cart-badge hidden>0</span>
      </a>
      <button class="hamburger-btn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="site-menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="site-menu" id="site-menu">
    <nav class="site-menu-nav">
      <ul>
        <li><a href="index.html#accueil">Accueil</a></li>
        <li><a href="index.html#univers">Univers</a></li>
        <li><a href="index.html#drop">Drop</a></li>
        <li><a href="archives.html">Archives</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <div class="socials">
        <a href="#" target="_blank" rel="noopener" data-cms-href="general.instagram_url">Instagram</a>
        <a href="#" target="_blank" rel="noopener" data-cms-href="general.tiktok_url">TikTok</a>
      </div>
    </nav>
  </div>

  <main>
    <section class="reveal" style="padding-top:120px;">
      <div class="container">
        <p class="section-label">Panier</p>
        <h1 class="section-title">Ton panier</h1>

        <div class="cart-empty" data-cart-empty hidden>
          <p>Ton panier est vide.</p>
          <a href="index.html#drop" class="btn">Découvrir le drop</a>
        </div>

        <div data-cart-content>
          <div class="cart-list" data-cart-list></div>

          <div class="cart-summary">
            <p class="cart-grand-total">Total : <strong data-cart-grand-total>0</strong> €</p>
            <button type="button" class="btn" data-cart-checkout-btn>Payer</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 <span data-cms="general.brand_name">[NOM DE LA MARQUE]</span>. Tous droits réservés.</p>
      <p data-cms="general.footer_legal">[PLACEHOLDER — statut juridique / mention légale à venir]</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <!-- Bundle React/Three.js buildé depuis src/shader-bg/ via `npm run build:shader`
       (voir vite.config.js) — monte le fond animé dans #shader-bg. -->
  <script defer src="js/shader-bg.bundle.js"></script>
  <script src="js/content.js"></script>
