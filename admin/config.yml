backend:
  name: github
  repo: sgaignardanselme-cloud/AnselmeEdgar
  branch: main

# Sveltia CMS (Decap-compatible rewrite — see admin/index.html) reads this
# same backend block, but doesn't need base_url/an OAuth proxy at all: its
# login screen offers "Sign In with Token" (a GitHub personal access
# token, pasted in directly) alongside/instead of the OAuth flow, which is
# enough for the two of us as the only GitHub users on this repo — see
# README.md "Administration du contenu (CMS)". No Netlify Identity, Git
# Gateway, or self-hosted OAuth Worker involved. Every commit is
# authenticated as whichever GitHub user's token/login was used and
# pushed straight to `branch` above — that GitHub user needs write access
# to this repo (see README.md).
publish_mode: simple

# local_backend: true used to enable local file editing via `npx
# decap-server` — Sveltia CMS's official Decap migration notes list this
# as a deprecated/no-longer-needed option, so it's dropped rather than
# left in as a no-op. Local testing without pushing to GitHub is instead
# just "Sign In with Token" against the real repo (see README.md).

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Réglages du site"
    editor:
      preview: false
    files:
      - label: "Général (nom de la marque, réseaux sociaux, footer)"
        name: "general"
        file: "content/settings/general.json"
        fields:
          - { label: "Nom de la marque", name: "brand_name", widget: "string", hint: "Affiché dans le logo (haut de chaque page), le titre d'onglet du navigateur et le grand titre d'ouverture de la page d'accueil." }
          - { label: "Description du site (SEO)", name: "meta_description", widget: "text" }
          - { label: "Lien Instagram", name: "instagram_url", widget: "string", required: false }
          - { label: "Lien TikTok", name: "tiktok_url", widget: "string", required: false }
          - { label: "Mention légale (footer)", name: "footer_legal", widget: "string" }

      - label: "Accueil — Hero"
        name: "hero"
        file: "content/settings/hero.json"
        fields:
          - { label: "Phrase d'accroche", name: "headline", widget: "text", hint: "Le grand titre de la première section. Un retour à la ligne (touche Entrée) est possible et sera respecté à l'affichage." }
          - { label: "Sous-titre", name: "subtitle", widget: "string" }
          - { label: "Visuel principal (affiche du drop)", name: "image", widget: "image", required: false }
          - { label: "Texte du bouton principal", name: "cta_primary_label", widget: "string" }
          - { label: "Texte du bouton secondaire", name: "cta_secondary_label", widget: "string" }

      - label: "Univers"
        name: "univers"
        file: "content/settings/univers.json"
        fields:
          - { label: "Titre — note d'intention", name: "intent_title", widget: "string" }
          - { label: "Texte — note d'intention", name: "intent_text", widget: "text", hint: "Le texte de storytelling (musique / sport / art)." }
          - label: "Pièce exposée"
            name: "piece"
            widget: "object"
            fields:
              - { label: "Année", name: "year", widget: "string" }
              - { label: "Nom du drop / de la pièce", name: "title", widget: "string" }
              - { label: "Matières / technique", name: "meta", widget: "string" }
              - { label: "Note (façon commissaire d'exposition)", name: "note", widget: "text" }
              - { label: "Visuel", name: "image", widget: "image", required: false }
          - label: "Pièce maîtresse (collection permanente)"
            name: "masterpiece"
            widget: "object"
            fields:
              - { label: "Nom de l'objet", name: "name", widget: "string" }
              - { label: "Description", name: "note", widget: "text" }
              - { label: "Visuel", name: "image", widget: "image", required: false }

      - label: "Drop en cours"
        name: "drop"
        file: "content/settings/drop.json"
        fields:
          - { label: "Nom du drop", name: "drop_name", widget: "string" }
          - { label: "Visuel principal du drop", name: "image", widget: "image", required: false }
          - { label: "Texte de présentation", name: "intro_text", widget: "text" }
          - { label: "Date de sortie", name: "release_date", widget: "datetime" }
          - { label: "Quantité disponible", name: "quantity", widget: "number", value_type: "int" }
          - { label: "Prix (si unique pour tout le drop)", name: "price", widget: "string", required: false, hint: "Laisser vide si le prix varie par pièce (voir la collection Produits)." }
          - { label: "Titre — bloc liste d'attente", name: "waitlist_title", widget: "string" }
          - { label: "Texte — bloc liste d'attente", name: "waitlist_text", widget: "text" }
          - { label: "Texte du bouton — liste d'attente", name: "waitlist_cta_label", widget: "string" }

      - label: "Contact"
        name: "contact"
        file: "content/settings/contact.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte d'introduction", name: "text", widget: "text" }
          - { label: "Note sous le formulaire", name: "form_note", widget: "text" }

      - label: "Archives"
        name: "archives"
        file: "content/settings/archives.json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Message quand aucun drop archivé", name: "empty_message", widget: "text" }

      - label: "Guide des tailles"
        name: "size_guide"
        file: "content/settings/size_guide.json"
        fields:
          - label: "Tableau des tailles"
            name: "rows"
            widget: "list"
            hint: "Une ligne par taille — laissez une mesure vide si elle ne s'applique pas."
            summary: "{{fields.size}}"
            fields:
              - { label: "Taille", name: "size", widget: "string" }
              - { label: "Tour de poitrine (cm)", name: "chest", widget: "string", required: false }
              - { label: "Longueur (cm)", name: "length", widget: "string", required: false }
              - { label: "Épaules (cm)", name: "shoulders", widget: "string", required: false }

  # Collection "fichiers" (comme "settings" au-dessus), pas "dossier" — 6
  # pièces fixes, listées une par une ci-dessous. Pas de bouton "New" ni
  # de suppression possible depuis l'interface : pour ajouter/retirer une
  # pièce, il faut modifier cette liste directement (et le fichier
  # content/products/*.json|.md correspondant) puis redéployer. Chaque
  # entrée répète le même jeu de champs — les collections "fichiers" de
  # Decap/Sveltia n'ont pas de mécanisme pour les partager entre entrées
  # comme le fait `fields:` sur une collection "dossier".
  - name: "products"
    label: "Produits (pièces du drop)"
    editor:
      preview: false
    files:
      - label: "Sacoche"
        name: "sacoche"
        file: "content/products/sacoche.md"
        fields: &product_fields
          - { label: "Nom du produit", name: "name", widget: "string" }
          - { label: "Prix (€)", name: "price", widget: "number", value_type: "float" }
          - { label: "Description courte", name: "short_description", widget: "text", hint: "Affichée sur la fiche produit, sous le prix." }
          - { label: "Matières / composition", name: "materials", widget: "text", hint: "Ex : 100% coton biologique, grammage 280g/m², confectionné en France." }
          - { label: "Photo principale (miniature galerie)", name: "image", widget: "image", required: false, hint: "Utilisée sur les grilles produits (page d'accueil, \"Autres pièces du drop\"). Si vide, la vue Devant ci-dessous sert de miniature." }
          - label: "Vues sur cintre (fiche produit)"
            name: "image_front"
            widget: "image"
            required: false
            hint: "Vue de face — affichée en premier sur la fiche produit."
          - { label: "Vue de dos", name: "image_back", widget: "image", required: false }
          - { label: "Vue de profil", name: "image_side", widget: "image", required: false }
          - { label: "Photo portée", name: "image_worn", widget: "image", required: false, hint: "Le vêtement porté par une personne, en plus des vues sur cintre ci-dessus." }
          - label: "Photos additionnelles"
            name: "gallery"
            widget: "list"
            required: false
            field: { label: "Photo", name: "image", widget: "image" }
          - label: "Tailles disponibles et stock"
            name: "sizes"
            widget: "list"
            hint: "Une ligne par taille — la quantité disponible détermine si la taille est sélectionnable sur la fiche produit (0 = grisée/barrée)."
            summary: "{{fields.size}} — {{fields.stock}} en stock"
            default:
              - { size: "S", stock: 10 }
              - { size: "M", stock: 10 }
              - { size: "L", stock: 10 }
              - { size: "XL", stock: 10 }
            fields:
              - { label: "Taille", name: "size", widget: "select", options: ["S", "M", "L", "XL"] }
              - { label: "Quantité disponible", name: "stock", widget: "number", value_type: "int", default: 10, min: 0 }
          - { label: "Ordre d'affichage", name: "order", widget: "number", value_type: "int", default: 1, hint: "Les produits s'affichent du plus petit au plus grand numéro." }

      - label: "TEST 2"
        name: "test-2"
        file: "content/products/test-2.md"
        fields: *product_fields

      - label: "Pièce 1"
        name: "piece-1"
        file: "content/products/piece-1.json"
        fields: *product_fields

      - label: "Pièce 2"
        name: "piece-2"
        file: "content/products/piece-2.json"
        fields: *product_fields

      - label: "Pièce 3"
        name: "piece-3"
        file: "content/products/piece-3.json"
        fields: *product_fields

      - label: "Pièce 4"
        name: "piece-4"
        file: "content/products/piece-4.json"
        fields: *product_fields
